rule: source/no-comments
files:
  go.mod: |
    module example.com/gentalent

    go 1.26
  internal/app/embed.go: |
    //go:build unix

    package app

    import "embed"

    //go:embed defaults.yaml
    var defaults embed.FS

    //go:noinline
    func Address() string {
      return "https://example.com/*not*/a//comment"
    }

    func Slash() rune { return '/' }

    func Raw() string {
      return `
        // inside a raw string
        /* also inside */
      `
    }
  internal/app/explained.go: |
    // Package app has a package comment.
    package app

    /* A block comment
       over two lines. */
    func Explained() int {
      return 1 // trailing
    }

    // go:embed with a space is prose, not a directive.
    func Spaced() {}
  internal/app/cgo.go: |
    package app

    // #include <stdlib.h>
    // #include <string.h>
    import "C"

    // Not part of the preamble.
    func Free() {}
  internal/app/generated.go: |
    // Code generated by stringer; DO NOT EDIT.

    package app

    // Prose inside a generated file.
    func Generated() {}
  internal/app/late_marker.go: |
    package app

    // Code generated by hand; DO NOT EDIT.
    func Late() {}
  internal/app/licensed.go: |
    // SPDX-License-Identifier: MIT

    package app

    func Licensed() error {
      return nil //nolint:errcheck
    }
expect:
  - kind: violation
    path: internal/app/cgo.go
    line: 7
    message: 'Comment "// Not part of the preamble." is not allowed.'
  - kind: violation
    path: internal/app/late_marker.go
    line: 3
    message: 'Comment "// Code generated by hand; DO NOT EDIT." is not allowed.'
  - kind: violation
    path: internal/app/licensed.go
    line: 6
    message: 'Suppression "//nolint:errcheck" is not allowed.'
  - kind: violation
    path: internal/app/explained.go
    line: 1
    message: 'Comment "// Package app has a package comment." is not allowed.'
  - kind: violation
    path: internal/app/explained.go
    line: 4
    message: 'Comment "/* A block comment" is not allowed.'
  - kind: violation
    path: internal/app/explained.go
    line: 7
    message: 'Comment "// trailing" is not allowed.'
  - kind: violation
    path: internal/app/explained.go
    line: 10
    message: 'Comment "// go:embed with a space is prose, not a directive." is not allowed.'
