[settings]
experimental = true

[tools]
go = "1.27.1"
jq = "1.8.1"

[env]
DISPLAY = ":0"
WAYLAND_DISPLAY = "wayland-0"
XDG_RUNTIME_DIR = "/run/user/1000"
DBUS_SESSION_BUS_ADDRESS = "unix:path=/run/user/1000/bus"
_.path = ["{{ env.HOME }}/.local/share/mise/shims", "{{ env.HOME }}/.local/bin"]

[daemons.beeper]
run = "exec ./scripts/run-beeper.sh"
ready_port = 23373
ready_cmd = "curl -sf http://127.0.0.1:23373/v1/info >/dev/null"
boot_start = true
retry = true
proxy = false

# Runs the commit pinned in .live, not the working tree. Editing code never touches the
# live bot; `mise run deploy` does. There is deliberately no `watch`.
[daemons.gentalent]
depends = ["beeper"]
run = "exec ./.live/scripts/run-gentalent-live.sh ./config.json"
boot_start = true
retry = true
proxy = false

[tasks.test]
description = "Run the Go test suite and the deploy and ship script checks"
run = ["go vet ./...", "go test ./...", "bash scripts/deploy-test.sh", "bash scripts/ship-test.sh"]

[tasks.privacy]
description = "Scan every commit on every local branch for personal data and secrets"
run = "./scripts/privacy-check --all"

[tasks.ship]
description = "From the main checkout: push a branch, open its PR, deploy it, then move and push main"
run = "./scripts/ship.sh"

[tasks.deploy]
description = "Test a commit (default HEAD), pin .live to it, restart the live bot"
run = "./scripts/deploy.sh"

[tasks.status]
description = "Daemons, deployed commit, Beeper check, and replies needing attention"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise daemons status
echo "Deployed: $(git -C .live log -1 --format='%h %s' 2>/dev/null || echo 'nothing in .live')"
go run ./cmd/gentalent doctor --chat
go run ./cmd/gentalent status --live
'''

[tasks.logs]
description = "Show recent live GenTalent logs"
run = "mise daemons logs gentalent -n 50"
